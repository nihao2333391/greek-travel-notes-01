<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Greek Travel Notes 01 — The Language Environment Abroad</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-rule" aria-hidden="true"></div>
      <label class="language-control">
        <span class="language-label" id="language-label">Language</span>
        <select id="language-select" aria-labelledby="language-label">
          <option value="en" selected>English</option>
          <option value="el">Ελληνικά</option>
          <option value="nl">Nederlands</option>
        </select>
      </label>
    </header>

    <main id="page" class="page-shell">
      <article id="article" class="article" aria-labelledby="article-title"></article>
    </main>
